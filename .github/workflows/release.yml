# On every push to main: work out the next version from the conventional commits since the last
# release, and if there is one, build the Windows installer and publish it as a GitHub Release.
# The tag the release creates (v1.2.3) is where the version lives; the only thing committed back
# is CHANGELOG.md, as a docs: commit so it doesn't make another release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all commits and tags, to work out the version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the next version
        id: version
        run: python scripts/next_version.py --notes notes.md --changelog CHANGELOG.md --write-version

      # PyInstaller's ready-made bootloader (the exe's launcher) is the same file in every app built
      # with it, malware included, so antivirus often flags it. Compiling our own (MSVC is on the
      # runner) gives a launcher nobody else has.
      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller --no-binary pyinstaller --verbose

      - name: Build the exe
        if: steps.version.outputs.release == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/make_icon.py
          pyinstaller packaging/nyanga.spec --noconfirm

      - name: Build the installer
        if: steps.version.outputs.release == 'true'
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} packaging\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create v${{ steps.version.outputs.version }}
          dist/installer/Nyanga-Setup-${{ steps.version.outputs.version }}.exe
          --title "v${{ steps.version.outputs.version }}"
          --notes-file notes.md
          --target ${{ github.sha }}

      - name: Commit the changelog
        if: steps.version.outputs.release == 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true  # stop at the first git command that fails
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- version.py
          git add CHANGELOG.md
          git commit -m "docs: changelog for v${{ steps.version.outputs.version }}"
          git pull --rebase origin main
          git push origin HEAD:main
