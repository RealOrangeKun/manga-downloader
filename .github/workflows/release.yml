# On every push to main: work out the next version from the conventional commits since the last
# release, and if there is one, build the Windows installer and the Linux AppImage and publish them
# as a GitHub Release. The tag the release creates (v1.2.3) is where the version lives; the only
# thing committed back is CHANGELOG.md, as a docs: commit so it doesn't make another release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all commits and tags, to work out the version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the next version
        id: version
        run: python scripts/next_version.py --notes notes.md --changelog CHANGELOG.md --whats-new whats_new.json --write-version

      # The builds need version.py and whats_new.json; the publish job needs the notes and changelog.
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.release == 'true'
        with:
          name: version
          path: |
            version.py
            whats_new.json
            notes.md
            CHANGELOG.md

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyInstaller's ready-made bootloader (the exe's launcher) is the same file in every app built
      # with it, malware included, so antivirus often flags it. Compiling our own (MSVC is on the
      # runner) gives a launcher nobody else has.
      - name: Install dependencies
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller --no-binary pyinstaller --verbose

      - name: Build the exe
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/make_icon.py
          pyinstaller packaging/nyanga.spec --noconfirm

      - name: Build the installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.version.outputs.version }} packaging\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/installer/Nyanga-Setup-${{ needs.version.outputs.version }}.exe

  linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    # The AppImage runs on systems at least as new as the one it's built on, so build on an older one.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt's X11 plugin needs these; installed here, PyInstaller packs them into the app, so they
      # don't have to be on the user's system.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1
          python -m pip install -r requirements.txt pyinstaller

      - name: Build the AppImage
        run: packaging/build_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Nyanga-x86_64.AppImage

  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create v${{ needs.version.outputs.version }}
          out/windows/Nyanga-Setup-${{ needs.version.outputs.version }}.exe
          out/linux/Nyanga-x86_64.AppImage
          out/version/whats_new.json
          --title "v${{ needs.version.outputs.version }}"
          --notes-file out/version/notes.md
          --target ${{ github.sha }}

      - name: Rebuild the website
        # So its download button and What's new page pick up this release.
        env:
          HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No WEBSITE_DEPLOY_HOOK secret, skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null || echo "::warning::Website rebuild didn't start"

      - name: Commit the changelog
        run: |
          set -e
          cp out/version/CHANGELOG.md CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: changelog for v${{ needs.version.outputs.version }}"
          git pull --rebase origin main
          git push origin HEAD:main
