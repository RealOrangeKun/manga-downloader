# When the app's look changes, re-render its pictures from the real app (offscreen) and commit
# them: the website's (in nyanga-app/nyanga-web, pushed with the WEBSITE_PUSH_KEY deploy key, so
# Cloudflare redeploys the site) and the README's (here, as a docs: commit, so no release).
name: Screenshots

on:
  push:
    branches: [main]
    paths:
      - gui.py
      - theme.py
      - loader.py
      - core.py
      - assets/fonts/**
      - assets/icons/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: nyanga-app/nyanga-web
          path: nyanga-web
          ssh-key: ${{ secrets.WEBSITE_PUSH_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt offscreen needs EGL/xkbcommon; Noto is the fallback font the pictures were made with.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 fonts-noto-core
          python -m pip install -r requirements.txt

      - name: Render the website pictures
        working-directory: nyanga-web
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/render_shots.py
          python scripts/render_card.py
          python scripts/render_cats.py
          python scripts/export_icons.py

      # Needs fanfox.net; if it's down the website pictures still go out.
      - name: Render the README screenshots
        continue-on-error: true
        run: python scripts/readme_screenshots.py

      # Skipped until the WEBSITE_PUSH_KEY secret exists (nyanga-web is public, so it still renders).
      - name: Commit the website pictures
        working-directory: nyanga-web
        env:
          HAS_KEY: ${{ secrets.WEBSITE_PUSH_KEY != '' }}
        if: env.HAS_KEY == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public src/lib/icons.ts
          if git diff --cached --quiet; then echo "Website pictures unchanged"; exit 0; fi
          git commit -m "chore: refreshed the app pictures"
          git pull --rebase && git push

      - name: Commit the README screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme
          if git diff --cached --quiet; then echo "README screenshots unchanged"; exit 0; fi
          git commit -m "docs: refreshed the readme screenshots"
          git pull --rebase && git push
